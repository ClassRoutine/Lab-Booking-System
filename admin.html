<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Lab Booking</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071a3d,#123b83);padding:20px}.loginbox{background:#fff;width:min(410px,100%);padding:32px;border-radius:22px;box-shadow:0 25px 80px #0004}.brand{text-align:center}.brand b{display:block;color:#123b83;letter-spacing:1px}.brand strong{font-size:24px;display:block;margin:6px}.loginbox label{display:block;font-size:13px;font-weight:800;margin:16px 0 7px}.loginbox input{width:100%;padding:13px;border:1px solid #d5dce8;border-radius:10px}.loginbox button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#1455c7;color:#fff;font-weight:900}.err{margin-top:12px;background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;font-size:13px}header{background:#081d43;color:#fff;padding:17px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.logo{font-weight:900}.logo small{display:block;font-size:11px;opacity:.7;margin-top:3px}header button{border:1px solid #ffffff35;background:#ffffff15;color:#fff;padding:9px 13px;border-radius:8px}.role{background:#eaf2ff;color:#1455c7;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;margin-right:8px}main{max-width:1400px;margin:25px auto;padding:0 18px}.top{margin-bottom:18px}.top h1{margin:0;font-size:28px}.top p{color:#718096}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:15px}.stat{padding:17px}.stat span{font-size:11px;color:#718096;font-weight:800}.stat b{display:block;font-size:27px;margin-top:6px}.panel{padding:17px;margin-top:17px}.note{background:#f8fafc;padding:11px;border-radius:9px;color:#526071;font-size:13px;margin-bottom:12px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr auto;gap:9px}.filters input,.filters select{padding:10px;border:1px solid #d5dce8;border-radius:8px}.filters button{border:0;border-radius:8px;padding:10px 13px}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:1050px}.tbl th,.tbl td{padding:11px 9px;border-bottom:1px solid #edf0f5;text-align:left;font-size:12px}.tbl th{background:#fafbfd;color:#526071}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.pending{background:#fff4cc;color:#8a6200}.approved{background:#dcfce7;color:#166534}.cancelled{background:#fee2e2;color:#991b1b}.act{border:0;border-radius:7px;padding:6px 8px;font-size:10px;font-weight:900;margin-right:4px;cursor:pointer}.ok{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}footer{text-align:center;padding:25px;color:#718096;font-size:12px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.top{margin-top:8px}}@media(max-width:500px){.stats{grid-template-columns:1fr}.filters{grid-template-columns:1fr}header{padding:14px}}
</style></head><body><div id="login" class="login"><div class="loginbox"><div class="brand"><b>VARENDRA UNIVERSITY</b><strong>Lab Booking Admin</strong><small>Secure administrator access</small></div><label>Username</label><input id="un" autocomplete="username" placeholder="tareq2001"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button id="lb">LOGIN</button><div id="le" class="err hide"></div></div></div><div id="app" class="hide"><header><div class="logo">LAB BOOKING SYSTEM<small>Department of Computer Science &amp; Engineering</small></div><div><span id="role" class="role"></span><button id="out">Logout</button></div></header><main><div class="top"><h1>Admin Dashboard</h1><p id="welcome"></p></div><div class="stats"><div class="stat"><span>TODAY</span><b id="today">0</b></div><div class="stat"><span>PENDING</span><b id="pending">0</b></div><div class="stat"><span>APPROVED</span><b id="approved">0</b></div><div class="stat"><span>CANCELLED</span><b id="cancelled">0</b></div><div class="stat"><span>SHOWN</span><b id="shown">0</b></div></div><div class="panel"><div id="note" class="note"></div><div class="filters"><input id="fd" type="date"><select id="fl"><option value="">All Labs</option></select><select id="fs"><option value="">All Status</option><option>Pending</option><option>Approved</option><option>Cancelled</option></select><input id="q" placeholder="Search student / ID / teacher"><button id="clear">Clear</button></div></div><div class="panel"><div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>Time</th><th>Lab</th><th>Student</th><th>ID</th><th>Semester</th><th>Teacher</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><footer>Designed &amp; Developed by Md. Tareq Ben Musha © 2026</footer></div><script>const S=window.supabase.createClient('https://wftskmfxlbbhoryajqjm.supabase.co','sb_publishable_i1ay8CjelMyvaJyQrd9pbw_I4NCXFdD');const $=x=>document.getElementById(x);let me=null,books=[];const email=u=>u.trim().toLowerCase()+'@labbooking.local';function err(x){$('le').textContent=x;$('le').classList.remove('hide')}async function start(){let{data:{user}}=await S.auth.getUser();if(!user)return;let r=await S.from('admin_users').select('id,username,display_name,role,is_active').eq('auth_user_id',user.id).single();if(r.error||!r.data||!r.data.is_active){await S.auth.signOut();err('This account is not configured or active.');return}me=r.data;$('login').classList.add('hide');$('app').classList.remove('hide');$('welcome').textContent=`Welcome, ${me.display_name}`;$('role').textContent=me.role==='super_admin'?'SUPER ADMIN':'LAB IN-CHARGE';$('note').textContent=me.role==='super_admin'?'You can approve/cancel bookings for every lab.':'You can see all lab bookings. Approve/Cancel is allowed only for your assigned lab(s).';await labs();await load();render()}async function login(){let u=$('un').value,p=$('pw').value;$('le').classList.add('hide');if(!u||!p)return err('Enter username and password.');$('lb').disabled=true;let r=await S.auth.signInWithPassword({email:email(u),password:p});if(r.error){$('lb').disabled=false;return err('Invalid username or password.')}await start()}$('lb').onclick=login;$('pw').onkeydown=e=>e.key==='Enter'&&login();async function labs(){let r=await S.from('labs').select('id,name,code,room_no').eq('is_active',true).order('id');if(r.error)return;let x=r.data||[];$('fl').innerHTML='<option value="">All Labs</option>'+x.map(l=>`<option value="${l.id}">${l.name} (${l.code})</option>`).join('')}async function load(){let r=await S.from('bookings').select('id,student_name,student_id,course_teacher,booking_date,start_time,end_time,status,lab_id,semester_id,labs(name,code,room_no),semesters(name)').order('booking_date',{ascending:false}).order('start_time');if(r.error){alert('Unable to load bookings: '+r.error.message);return}books=r.data||[]}const ft=t=>{let[a,b]=t.split(':');a=+a;return `${a%12||12}:${b} ${a>=12?'PM':'AM'}`};function render(){let fd=$('fd').value,fl=$('fl').value,fs=$('fs').value,q=$('q').value.toLowerCase();let x=books.filter(b=>(!fd||b.booking_date===fd)&&(!fl||String(b.lab_id)===fl)&&(!fs||b.status===fs)&&(!q||`${b.student_name} ${b.student_id} ${b.course_teacher}`.toLowerCase().includes(q)));let td=new Date().toISOString().slice(0,10);$('today').textContent=books.filter(b=>b.booking_date===td).length;$('pending').textContent=books.filter(b=>b.status==='Pending').length;$('approved').textContent=books.filter(b=>b.status==='Approved').length;$('cancelled').textContent=books.filter(b=>b.status==='Cancelled').length;$('shown').textContent=x.length;$('rows').innerHTML=x.map(b=>`<tr><td>${b.booking_date}</td><td>${ft(b.start_time)}–${ft(b.end_time)}</td><td><b>${b.labs?.name||'—'}</b><br><small>${b.labs?.code||''} • ${b.labs?.room_no||''}</small></td><td>${b.student_name}</td><td>${b.student_id}</td><td>${b.semesters?.name||'—'}</td><td>${b.course_teacher}</td><td><span class="badge ${b.status.toLowerCase()}">${b.status}</span></td><td>${b.status==='Pending'?`<button class="act ok" onclick="act(${b.id},'approve')">Approve</button><button class="act no" onclick="act(${b.id},'cancel')">Cancel</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;padding:35px">No bookings found.</td></tr>'}async function act(id,t){if(!confirm(t==='approve'?'Approve this booking?':'Cancel this booking?'))return;let r=await S.rpc(t==='approve'?'approve_booking':'cancel_booking',{p_booking_id:id});if(r.error){alert(r.error.message);return}await load();render()}['fd','fl','fs','q'].forEach(id=>$(id).oninput=render);$('clear').onclick=()=>{['fd','fl','fs','q'].forEach(id=>$(id).value='');render()};$('out').onclick=async()=>{await S.auth.signOut();location.reload()};S.auth.getSession().then(x=>x.data.session&&start());</script></body></html>
