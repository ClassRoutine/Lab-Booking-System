<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard | Lab Booking System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}button,input,select{font:inherit}input{pointer-events:auto;user-select:text;-webkit-user-select:text}.hidden{display:none!important}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#071a3d,#1d4e9e);padding:20px}.login-card{width:min(420px,100%);background:#fff;border-radius:20px;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
.brand{text-align:center;color:#173d83;font-weight:800;letter-spacing:1px;font-size:14px}.login-card h1{text-align:center;margin:8px 0 5px;font-size:27px;color:#122b5c}.login-card p{text-align:center;color:#718096;margin:0 0 26px;font-size:13px}.field{margin:15px 0;position:relative;z-index:2}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
.field input{display:block;position:relative;z-index:3;width:100%;padding:13px 14px;border:1px solid #cfd8e6;border-radius:10px;outline:none;background:#fff!important;color:#172033!important;caret-color:#172033!important;-webkit-text-fill-color:#172033!important}.field input::placeholder{color:#8a94a6!important;opacity:1}.field input:focus{border-color:#2868d8;box-shadow:0 0 0 3px rgba(40,104,216,.12)}
.login-btn{width:100%;border:0;border-radius:10px;padding:14px;background:#2864d0;color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.login-btn:disabled{opacity:.6;cursor:not-allowed}.error{margin-top:14px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;padding:11px;border-radius:9px;font-size:13px;text-align:center}
.dashboard{min-height:100vh}.top{background:linear-gradient(135deg,#071a3d,#17458f);color:#fff;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;gap:15px}.top h1{font-size:21px;margin:0}.top small{opacity:.8}.logout{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:9px 14px;cursor:pointer}.wrap{max-width:1250px;margin:25px auto;padding:0 18px}
.profile{background:#fff;border:1px solid #e1e7f0;border-radius:14px;padding:15px 18px;margin-bottom:18px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.profile strong{color:#173d83}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e1e7f0;border-radius:14px;padding:18px}.stat b{display:block;font-size:26px;color:#173d83}.stat span{font-size:12px;color:#718096}
.filters{background:#fff;border:1px solid #e1e7f0;border-radius:14px;padding:15px;display:grid;grid-template-columns:1.1fr 1fr 1fr 2fr;gap:10px;margin-bottom:18px}.filters input,.filters select{width:100%;padding:11px;border:1px solid #d2dae7;border-radius:9px;background:#fff}.table-card{background:#fff;border:1px solid #e1e7f0;border-radius:14px;overflow:auto}.table-title{padding:16px;font-weight:800;border-bottom:1px solid #e8edf4;color:#173d83}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:12px 10px;border-bottom:1px solid #edf1f6;text-align:left;font-size:12px;vertical-align:top}.table th{background:#f8fafc;color:#526174}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.pending{background:#fff7d6;color:#8a6200}.approved{background:#dcfce7;color:#166534}.cancelled{background:#fee2e2;color:#991b1b}.action{border:0;border-radius:7px;padding:7px 9px;color:#fff;font-size:11px;font-weight:800;cursor:pointer;margin:2px}.approve{background:#16834a}.cancel{background:#c73535}.empty{text-align:center;padding:35px;color:#718096}footer{text-align:center;color:#718096;font-size:12px;padding:25px}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.top{padding:16px}.wrap{padding:0 10px}}@media(max-width:520px){.stats,.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="loginPage" class="login-page"><div class="login-card">
<div class="brand">VARENDRA UNIVERSITY</div><h1>Lab Booking Admin</h1><p>Secure administrator access</p>
<form id="loginForm" autocomplete="on">
<div class="field"><label for="username">Username</label><input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" spellcheck="false" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required></div>
<button id="loginBtn" class="login-btn" type="submit">LOGIN</button><div id="loginError" class="error hidden"></div>
</form></div></section>
<section id="dashboard" class="dashboard hidden"><header class="top"><div><h1>Lab Booking Dashboard</h1><small id="welcome"></small></div><button id="logoutBtn" class="logout">Logout</button></header>
<main class="wrap"><div class="profile"><div><strong id="adminName">—</strong><br><small id="adminRole">—</small></div><div><small>Permission: <b id="permissionText">—</b></small></div></div>
<div class="stats"><div class="stat"><b id="totalCount">0</b><span>Total shown</span></div><div class="stat"><b id="pendingCount">0</b><span>Pending</span></div><div class="stat"><b id="approvedCount">0</b><span>Approved</span></div><div class="stat"><b id="todayCount">0</b><span>Today</span></div></div>
<div class="filters"><input id="dateFilter" type="date"><select id="labFilter"><option value="">All Labs</option></select><select id="statusFilter"><option value="">All Status</option><option>Pending</option><option>Approved</option><option>Cancelled</option></select><input id="searchFilter" type="search" placeholder="Search student, ID or teacher"></div>
<div class="table-card"><div class="table-title">All Laboratory Bookings</div><table class="table"><thead><tr><th>Student</th><th>ID</th><th>Semester</th><th>Lab</th><th>Date</th><th>Time</th><th>Teacher</th><th>Purpose</th><th>Status</th><th>Action</th></tr></thead><tbody id="bookingRows"></tbody></table></div></main>
<footer>Designed &amp; Developed by Md. Tareq Ben Musha © 2026</footer></section>
<script>
const SUPABASE_URL="https://wftskmfxlbbhoryajqjm.supabase.co";
const SUPABASE_KEY="sb_publishable_i1ay8CjelMyvaJyQrd9pbw_I4NCXFdD";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
password.addEventListener("click",()=>password.focus());
password.addEventListener("keydown",e=>{e.stopPropagation()});
const loginPage=document.getElementById("loginPage"),dashboard=document.getElementById("dashboard"),loginForm=document.getElementById("loginForm"),username=document.getElementById("username"),password=document.getElementById("password"),loginBtn=document.getElementById("loginBtn"),loginError=document.getElementById("loginError");
let admin=null,bookings=[];
function showError(m){loginError.textContent=m;loginError.classList.remove("hidden")}function clearError(){loginError.textContent="";loginError.classList.add("hidden")}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
loginForm.addEventListener("submit",async e=>{e.preventDefault();clearError();const u=username.value.trim().toLowerCase(),p=password.value;if(!u||!p){showError("Please enter username and password.");return}loginBtn.disabled=true;loginBtn.textContent="LOGGING IN...";try{const {data,error}=await sb.auth.signInWithPassword({email:u+"@labbooking.local",password:p});if(error)throw error;const {data:profile,error:pe}=await sb.from("admin_users").select("*").eq("auth_user_id",data.user.id).eq("is_active",true).single();if(pe||!profile){await sb.auth.signOut();throw new Error("This account is not registered as an active Lab Booking administrator.")}admin=profile;loginPage.classList.add("hidden");dashboard.classList.remove("hidden");document.getElementById("adminName").textContent=admin.display_name||admin.username;document.getElementById("adminRole").textContent=admin.role==="super_admin"?"Super Admin":"Lab In-charge";document.getElementById("permissionText").textContent=admin.role==="super_admin"?"Manage every laboratory":"View all bookings; approve/cancel only assigned laboratory";document.getElementById("welcome").textContent="Signed in as "+admin.username;await loadLabs();await loadBookings()}catch(err){showError(err.message||"Login failed.")}finally{loginBtn.disabled=false;loginBtn.textContent="LOGIN"}});
async function loadLabs(){const {data,error}=await sb.from("labs").select("id,name,code,room_no").order("id");if(error){console.error(error);return}const s=document.getElementById("labFilter");s.innerHTML='<option value="">All Labs</option>';(data||[]).forEach(x=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.name+" ("+x.code+")";s.appendChild(o)})}
async function loadBookings(){const {data,error}=await sb.from("bookings").select("*,labs(name,code,room_no),semesters(name)").order("booking_date",{ascending:true}).order("start_time",{ascending:true});if(error){document.getElementById("bookingRows").innerHTML='<tr><td colspan="10" class="empty">Unable to load bookings: '+esc(error.message)+'</td></tr>';return}bookings=data||[];render()}
function render(){const df=document.getElementById("dateFilter").value,lf=document.getElementById("labFilter").value,sf=document.getElementById("statusFilter").value,q=document.getElementById("searchFilter").value.toLowerCase().trim();const arr=bookings.filter(b=>{const hay=[b.student_name,b.student_id,b.course_teacher,b.booking_purpose,b.labs?.name].join(" ").toLowerCase();return(!df||b.booking_date===df)&&(!lf||String(b.lab_id)===lf)&&(!sf||b.status===sf)&&(!q||hay.includes(q))});document.getElementById("totalCount").textContent=arr.length;document.getElementById("pendingCount").textContent=arr.filter(x=>x.status==="Pending").length;document.getElementById("approvedCount").textContent=arr.filter(x=>x.status==="Approved").length;document.getElementById("todayCount").textContent=arr.filter(x=>x.booking_date===new Date().toISOString().slice(0,10)).length;const rows=document.getElementById("bookingRows");if(!arr.length){rows.innerHTML='<tr><td colspan="10" class="empty">No bookings found.</td></tr>';return}rows.innerHTML=arr.map(b=>{const own=admin.role==="super_admin"||String(admin.lab_id)===String(b.lab_id),can=own&&b.status==="Pending",st=(b.status||"Pending").toLowerCase();return `<tr><td><b>${esc(b.student_name)}</b></td><td>${esc(b.student_id)}</td><td>${esc(b.semesters?.name||b.semester_id)}</td><td>${esc(b.labs?.name||"")}<br><small>${esc(b.labs?.code||"")} • ${esc(b.labs?.room_no||"")}</small></td><td>${esc(b.booking_date)}</td><td>${esc(b.start_time)} – ${esc(b.end_time)}</td><td>${esc(b.course_teacher)}</td><td>${esc(b.booking_purpose)}</td><td><span class="badge ${st}">${esc(b.status)}</span></td><td>${can?`<button class="action approve" onclick="changeStatus(${b.id},'approve')">APPROVE</button><button class="action cancel" onclick="changeStatus(${b.id},'cancel')">CANCEL</button>`:`<span style="color:#718096;font-size:11px">${own?"No action":"View only"}</span>`}</td></tr>`}).join("")}
async function changeStatus(id,action){if(!confirm(action==="approve"?"Approve this booking?":"Cancel this booking?"))return;const {error}=await sb.rpc(action==="approve"?"approve_booking":"cancel_booking",{p_booking_id:id});if(error)alert(error.message);else await loadBookings()}
["dateFilter","labFilter","statusFilter","searchFilter"].forEach(id=>document.getElementById(id).addEventListener("input",render));document.getElementById("logoutBtn").addEventListener("click",async()=>{await sb.auth.signOut();location.reload()});
</script></body></html>
